<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Processor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f17;
      color: #e2e2f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 40px 48px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9090b8;
      margin-bottom: 6px;
    }

    input[type="file"],
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      background: #0f0f17;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e2f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #7c3aed; }
    input[type="file"] { padding: 8px 12px; cursor: pointer; }

    .row { display: flex; gap: 14px; }
    .row .field { flex: 1; }

    #watermark-group { transition: opacity 0.2s; }
    #resize-group    { transition: opacity 0.2s; }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 20px;
      min-height: 24px;
      font-size: 0.9rem;
      color: #a78bfa;
      text-align: center;
    }

    #result {
      margin-top: 20px;
      text-align: center;
    }
    #result img {
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid #2a2a4a;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #4f46e5;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #f87171; }
    .success { color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖼️ Image Processor</h1>

    <form id="upload-form">
      <div class="field">
        <label for="file-input">Изображение</label>
        <input id="file-input" type="file" accept="image/*" required />
      </div>

      <div class="field">
        <label for="mode-select">Операция</label>
        <select id="mode-select">
          <option value="resize">Resize — изменить размер</option>
          <option value="thumb">Thumb — миниатюра</option>
          <option value="watermark">Watermark — водяной знак</option>
        </select>
      </div>

      <div id="resize-group">
        <div class="row">
          <div class="field">
            <label for="width-input">Ширина (px)</label>
            <input id="width-input" type="number" min="1" placeholder="напр. 800" />
          </div>
          <div class="field">
            <label for="height-input">Высота (px)</label>
            <input id="height-input" type="number" min="1" placeholder="напр. 600" />
          </div>
        </div>
      </div>

      <div id="watermark-group" style="display:none">
        <div class="field">
          <label for="wm-text">Текст водяного знака</label>
          <input id="wm-text" type="text" placeholder="напр. © MyCompany" />
        </div>
      </div>

      <button id="submit-btn" type="submit">Отправить</button>
    </form>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
