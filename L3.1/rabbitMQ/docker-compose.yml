services:
  rabbitmq:
    image: rabbitmq:4.2.1-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    
      - "15672:15672"   # Веб-панель управления
    environment:
      RABBITMQ_DEFAULT_USER: notifyRMQUser
      RABBITMQ_DEFAULT_PASS: 123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
volumes:
  rabbitmq_data:
