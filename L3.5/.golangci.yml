run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  revive:
    severity: warning
  errcheck:
    check-type-assertions: false
    check-blank: false

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    
    - revive
    - unconvert
    - bodyclose
    - durationcheck
    - nilerr
    - prealloc
    - predeclared

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
